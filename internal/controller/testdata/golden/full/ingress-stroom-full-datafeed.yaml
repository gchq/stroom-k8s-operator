metadata:
  annotations:
    haproxy.router.openshift.io/rewrite-target: /stroom/noauth/datafeed
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/rewrite-target: /stroom/noauth/datafeed
  labels:
    app.kubernetes.io/component: stroom-cluster
    app.kubernetes.io/name: stroom
    stroom/cluster: full
  name: stroom-full-datafeed
  namespace: golden-full
  ownerReferences:
  - apiVersion: stroom.gchq.github.io/v1
    blockOwnerDeletion: true
    controller: true
    kind: StroomCluster
    name: full
    uid: <uid>
spec:
  ingressClassName: nginx
  rules:
  - host: stroom.example.com
    http:
      paths:
      - backend:
          service:
            name: stroom-full-node-data-http
            port:
              name: app-https
        path: /stroom/datafeeddirect
        pathType: Exact
  tls:
  - hosts:
    - stroom.example.com
    secretName: stroom-tls
status:
  loadBalancer: {}
