metadata:
  labels:
    app.kubernetes.io/component: stroom-cluster
    app.kubernetes.io/name: stroom
    stroom/cluster: fixed-size
  name: stroom-dev-ui-http
  namespace: golden-fixed-size
  ownerReferences:
  - apiVersion: stroom.gchq.github.io/v1
    blockOwnerDeletion: true
    controller: true
    kind: StroomCluster
    name: fixed-size
    uid: <uid>
spec:
  ports:
  - name: app-https
    port: 8443
    protocol: TCP
    targetPort: 0
  - name: app-http
    port: 8080
    protocol: TCP
    targetPort: 0
  - name: admin
    port: 8081
    protocol: TCP
    targetPort: 0
  selector:
    stroom/cluster: fixed-size
    stroom/nodeSet: ui
  type: ClusterIP
status:
  loadBalancer: {}
