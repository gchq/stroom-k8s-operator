data:
  my.cnf: |
    [mysqld]
    datadir=/var/lib/mysql
    port=3306
    user=mysql
metadata:
  labels:
    app.kubernetes.io/component: database-server
    app.kubernetes.io/instance: fixed-size
    app.kubernetes.io/name: stroom
  name: stroom-fixed-size-db
  namespace: golden-fixed-size
  ownerReferences:
  - apiVersion: stroom.gchq.github.io/v1
    blockOwnerDeletion: true
    controller: true
    kind: DatabaseServer
    name: fixed-size
    uid: <uid>
