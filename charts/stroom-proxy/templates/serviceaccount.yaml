{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stroom-proxy.serviceAccountName" . }}
  labels:
    {{- include "stroom-proxy.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The proxy and the DFK sync containers call AWS (S3) through EKS Pod
# Identity; nothing needs the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
