metadata:
  labels:
    app.kubernetes.io/component: stroom-cluster
    app.kubernetes.io/name: stroom
    stroom/cluster: external-db
  name: stroom-external-db-node-proc
  namespace: golden-external-db
  ownerReferences:
  - apiVersion: stroom.gchq.github.io/v1
    blockOwnerDeletion: true
    controller: true
    kind: StroomCluster
    name: external-db
    uid: <uid>
spec:
  replicas: 1
  selector:
    matchLabels:
      stroom/cluster: external-db
      stroom/nodeSet: proc
  serviceName: stroom-external-db-node-proc
  template:
    metadata:
      labels:
        stroom/cluster: external-db
        stroom/nodeSet: proc
    spec:
      affinity: {}
      automountServiceAccountToken: false
      containers:
      - env:
        - name: API_GATEWAY_HOST
          value: stroom.example.com
        - name: ADMIN_CONTEXT_PATH
          value: /stroomAdmin
        - name: APPLICATION_CONTEXT_PATH
          value: /
        - name: DOCKER_HOST_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['statefulset.kubernetes.io/pod-name']
        - name: DOCKER_HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['statefulset.kubernetes.io/pod-name']
        - name: POD_SUBDOMAIN
          value: stroom-external-db-node-proc.golden-external-db.svc.cluster.local
        - name: JAVA_OPTS
          value: -XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=75
        - name: STROOM_APP_HTTP_PORT
          value: "8080"
        - name: STROOM_APP_HTTPS_PORT
          value: "8443"
        - name: STROOM_ADMIN_PORT
          value: "8081"
        - name: STROOM_NODE
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['statefulset.kubernetes.io/pod-name']
        - name: STROOM_NODE_ROLE
          value: Processing
        - name: STROOM_JDBC_DRIVER_URL
          value: jdbc:mysql://stroom.abcdefghijkl.eu-west-2.rds.amazonaws.com:3306/stroom?serverTimezone=UTC&useUnicode=yes&characterEncoding=UTF-8&sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/stroom/db-tls/truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=db-truststore
        - name: STROOM_JDBC_DRIVER_CLASS_NAME
          value: com.mysql.cj.jdbc.Driver
        - name: STROOM_JDBC_DRIVER_USERNAME
          value: stroomuser
        - name: STROOM_JDBC_DRIVER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: stroomuser
              name: stroom-db
        - name: STROOM_STATISTICS_JDBC_DRIVER_URL
          value: jdbc:mysql://stroom.abcdefghijkl.eu-west-2.rds.amazonaws.com:3306/stats?serverTimezone=UTC&useUnicode=yes&characterEncoding=UTF-8&sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/stroom/db-tls/truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=db-truststore
        - name: STROOM_STATISTICS_JDBC_DRIVER_CLASS_NAME
          value: com.mysql.cj.jdbc.Driver
        - name: STROOM_STATISTICS_JDBC_DRIVER_USERNAME
          value: stroomuser
        - name: STROOM_STATISTICS_JDBC_DRIVER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: stroomuser
              name: stroom-db
        - name: STROOM_TEMP
          value: /stroom/tmp
        - name: IDENTITY_PROVIDER_TYPE
          value: INTERNAL_IDP
        - name: STROOM_NODE_MANAGED_JOBS
        - name: STROOM_OPERATOR_OPENID_CLIENT_ID
          value: stroom
        - name: STROOM_OPERATOR_OPENID_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: client-secret
              name: stroom-openid
        image: gchq/stroom:v7.14.0
        lifecycle:
          preStop:
            exec:
              command:
              - bash
              - /stroom/scripts/node-pre-stop.sh
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /stroomAdmin/filteredhealthcheck?allow=deadlocks
            port: admin
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        name: stroom-node
        ports:
        - containerPort: 8080
          name: app-http
          protocol: TCP
        - containerPort: 8443
          name: app-https
          protocol: TCP
        - containerPort: 8081
          name: admin
          protocol: TCP
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /stroomAdmin/filteredhealthcheck?deny=stroom.security.common.impl.ExternalIdpConfigurationProvider
            port: admin
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          exec:
            command:
            - bash
            - /stroom/scripts/node-start.sh
          failureThreshold: 24
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /stroom/scripts/utils.sh
          name: static-content
          readOnly: true
          subPath: utils.sh
        - mountPath: /stroom/scripts/node-start.sh
          name: static-content
          readOnly: true
          subPath: node-start.sh
        - mountPath: /stroom/scripts/node-pre-stop.sh
          name: static-content
          readOnly: true
          subPath: node-pre-stop.sh
        - mountPath: /stroom/auth
          name: api-token
        - mountPath: /stroom/logs
          name: data
          subPath: logs
        - mountPath: /stroom/output
          name: data
          subPath: output
        - mountPath: /stroom/tmp
          name: data
          subPath: tmp
        - mountPath: /stroom/lmdb
          name: data
          subPath: lmdb
        - mountPath: /stroom/lmdb_library
          name: data
          subPath: lmdb_library
        - mountPath: /stroom/planb
          name: data
          subPath: planb
        - mountPath: /stroom/proxy_repo
          name: data
          subPath: proxy-repo
        - mountPath: /stroom/reference_data
          name: data
          subPath: reference-data
        - mountPath: /stroom/reference_staging_data
          name: data
          subPath: reference_staging_data
        - mountPath: /stroom/search_results
          name: data
          subPath: search-results
        - mountPath: /stroom/api-key
          name: api-key
          readOnly: true
        - mountPath: /stroom/config/config.yml
          name: static-content
          readOnly: true
          subPath: stroomcluster-config.yaml
        - mountPath: /stroom/db-tls
          name: db-truststore
          readOnly: true
      initContainers:
      - command:
        - sh
        - -c
        - openssl pkcs12 -export -nokeys -in /opt/db-ca/ca.crt -out /data/truststore.p12
          -passout pass:db-truststore -jdktrust anyExtendedKeyUsage && chmod 0444
          /data/truststore.p12
        image: gchq/stroom:v7.14.0
        name: create-db-truststore
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /opt/db-ca
          name: db-ca
          readOnly: true
        - mountPath: /data
          name: db-truststore
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: stroom-external-db
      terminationGracePeriodSeconds: 60
      volumes:
      - configMap:
          defaultMode: 364
          name: stroom-external-db-static-content
        name: static-content
      - emptyDir: {}
        name: api-token
      - name: api-key
        secret:
          items:
          - key: apiKey
            path: apiKey
          secretName: stroom-external-db-api-key
      - configMap:
          items:
          - key: global-bundle.pem
            path: ca.crt
          name: rds-ca
        name: db-ca
      - emptyDir: {}
        name: db-truststore
  updateStrategy: {}
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/component: stroom-cluster
        app.kubernetes.io/name: stroom
        stroom/cluster: external-db
        stroom/nodeSet: proc
      name: data
    spec:
      resources: {}
    status: {}
status:
  availableReplicas: 0
  replicas: 0
