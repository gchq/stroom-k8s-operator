# The chart's defaults plus the one thing it requires: a forward destination.
# A file destination on the data volume, so the proxy boots in the CI boot
# test without any AWS access.
colour: blue
proxyConfig:
  # Substituted from the pod's POD_NAME; the boot test checks the proxy accepts it.
  proxyId: ci-${POD_NAME}
  forwardFileDestinations:
    - name: local
      path: /stroom-proxy/volume/forward
